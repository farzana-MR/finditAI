<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - FindIt AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-centered-layout">
    <div style="margin-bottom: 1.25rem;">
      <a href="login.html" class="auth-back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Login</span>
      </a>
    </div>

    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html">
        <img src="assets/logo/logo.png" alt="FindIt AI Logo" style="height: 48px; margin: 0 auto 1rem;">
      </a>
      <h2>Reset Password</h2>
      <p style="color:var(--text-muted); font-size:0.95rem; margin-top:0.25rem;">
        Enter your registered email address and we'll send you an instant reset verification code.
      </p>
    </div>

    <div id="forgot-success-box" style="display:none; margin-bottom: 1.25rem; padding: 1rem; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: var(--radius-md); color: #065f46; font-size: 0.9rem;"></div>

    <form id="forgot-password-form">
      <div class="form-group">
        <label class="form-label" for="forgot-email">Registered Email Address <span class="required">*</span></label>
        <div class="input-container">
          <input type="email" id="forgot-email" class="form-input" placeholder="e.g. alex.morgan@example.com" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;">
        Send Recovery Link
      </button>
    </form>

    <div class="auth-footer-prompt">
      Remembered your password? <a href="login.html">Back to Sign In</a>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
