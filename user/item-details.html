          </button>

      <main class="content-body">
        <div id="item-details-view" class="card" style="max-width: 980px; margin: 0 auto; padding: 2.25rem; border-radius:24px;">
          <!-- Rendered dynamically -->
        </div>
      </main>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('item-details-view');
      const params = new URLSearchParams(window.location.search);
      const itemId = params.get('id');
      const itemType = params.get('type') || 'lost';

      const state = getState();
      let item = null;

      if (itemType === 'found') {
        item = (state.foundItems || []).find(i => i.id === itemId);
      } else {
        item = (state.lostItems || []).find(i => i.id === itemId);
      }

      if (!item) {
        item = (state.lostItems || []).find(i => i.id === itemId) || (state.foundItems || []).find(i => i.id === itemId);
      }

      if (!item) {
        item = state.lostItems[0] || {};
      }

      const isLost = itemType === 'lost' || !item.custody;

      container.innerHTML = `
        <div style="display:grid; grid-template-columns: 1fr 1.2fr; gap: 2.5rem; align-items: start;">
          <div>
            <div style="width:100%; height:340px; border-radius:20px; overflow:hidden; border:1px solid #e2e8f0; background:#f1f5f9; margin-bottom:1rem; box-shadow:0 4px 20px rgba(15,23,42,0.06);">
              <img src="${item.image || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600'}" alt="${item.name}" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div class="badge ${isLost ? 'badge-lost' : 'badge-found'}" style="width:100%; justify-content:center; padding:0.6rem; font-size:0.85rem; font-weight:700;">
              ● ${isLost ? 'REPORTED LOST ITEM' : 'REPORTED FOUND ITEM'}
            </div>
          </div>

          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
              <span class="badge badge-primary">${item.category || 'General'}</span>
              <span style="font-size:0.85rem; color:var(--text-subtle); font-family:var(--font-mono);">ID: ${item.id}</span>
            </div>

            <h1 style="font-size: 2rem; font-weight:800; margin-bottom: 1rem;">${item.name}</h1>

            <div style="background:#f8fafc; border-radius:14px; border:1px solid #eef2f6; padding:1.25rem 1.4rem; margin-bottom:1.5rem; display:flex; flex-direction:column; gap:0.65rem; font-size:0.925rem;">
              <div>📍 <strong>${isLost ? 'Lost Location' : 'Found Location'}:</strong> ${item.location}</div>
              <div>📅 <strong>Date Reported:</strong> ${formatDate(item.date)}</div>
              <div>🎨 <strong>Dominant Colour:</strong> ${item.color || 'Unspecified'}</div>
              ${!isLost && item.custody ? `<div>🏢 <strong>Current Physical Custody:</strong> <span style="color:var(--primary); font-weight:700;">${item.custody}</span></div>` : ''}
              <div>👤 <strong>Reported By:</strong> ${item.userName || 'Community User'}</div>
            </div>

            <div style="margin-bottom: 1.5rem;">
              <h3 style="font-size:1.1rem; margin-bottom:0.5rem;">Description & Distinctive Features</h3>
              <p style="color:var(--text-muted); line-height:1.6;">${item.description || 'No detailed description provided.'}</p>
            </div>

            <div style="display:flex; gap:1rem; flex-wrap:wrap; padding-top:1.5rem; border-top:1px solid #f1f5f9;">
              ${!isLost ? `
                <a href="claim-item.html?id=${item.id}" class="btn btn-primary btn-lg" style="flex:1;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  <span>Submit Ownership Claim</span>
                </a>
              ` : `
                <a href="matches.html" class="btn btn-primary btn-lg" style="flex:1;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"></path></svg>
                  <span>View AI Matches</span>
                </a>
              `}
              <a href="search-items.html" class="btn btn-secondary btn-lg">Back to Search</a>
            </div>
          </div>
        </div>
      `;
    });
  </script>
