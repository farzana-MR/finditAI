<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - FindIt AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-centered-layout" style="border-top: 4px solid var(--accent-neon);">
    <div style="margin-bottom: 1.25rem;">
      <a href="../index.html" class="auth-back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Main Site</span>
      </a>
    </div>

    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="../index.html">
        <img src="../assets/logo/logo.png" alt="FindIt AI Logo" style="height: 52px; margin: 0 auto 1rem;">
      </a>
      <span class="badge badge-primary" style="margin-bottom: 0.5rem;">AUTHORIZED PERSONNEL ONLY</span>
      <h2>Admin Control Center</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.25rem;">
        Campus Security, Facilities Management & System Administration
      </p>
    </div>

    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label class="form-label" for="admin-email">Admin Email Address</label>
        <div class="input-container">
          <input type="email" id="admin-email" class="form-input" value="admin@findit.ai" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="admin-password">Secure Password</label>
        <div class="input-container">
          <input type="password" id="admin-password" class="form-input with-icon-right" value="AdminPass2026!" required>
          <button type="button" class="password-toggle-btn" data-target="admin-password" title="Toggle visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-teal" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">
        Authenticate as Admin
      </button>
    </form>

    <div class="auth-footer-prompt">
      Not an admin? <a href="../login.html">Return to User Login</a>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function handleAdminLogin(e) {
      e.preventDefault();
      sessionStorage.setItem('findit_logged_in', 'true');
      sessionStorage.setItem('findit_session_role', 'admin');
      showToast('Authentication verified. Welcome to Admin Portal!', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    }
  </script>
</body>
</html>
